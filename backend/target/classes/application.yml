server:
  port: 8080

spring:
  application:
    name: sih-security-platform
  datasource:
    url: jdbc:h2:file:./data/security_platform;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

security:
  platform:
    default-target: "https://worldmonitor.app"
    semgrep-rules-path: "../scanner/semgrep/worldmonitor-rules.yaml"
    zap-config-path: "../scanner/zap/scan-config.yaml"
    reports-dir: "./reports"
